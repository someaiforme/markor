name: Build Debug APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleFlavorDefaultDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: markor-flavorDefault-debug
          path: app/build/outputs/apk/flavorDefault/debug/*.apk
          if-no-files-found: error
          retention-days: 14
